name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v1.6.12-2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      package_version: ${{ steps.version.outputs.package_version }}
      package_release: ${{ steps.version.outputs.package_release }}
      source_version: ${{ steps.version.outputs.source_version }}
      source_ref: ${{ steps.version.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - id: version
        name: Validate tag and package version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          package_version="$(sed -n 's/^PKG_VERSION:=//p' ddns-web/Makefile)"
          package_release="$(sed -n 's/^PKG_RELEASE:=//p' ddns-web/Makefile)"
          source_version="$(sed -n 's/^PKG_SOURCE_VERSION:=//p' ddns-web/Makefile | sed 's/[[:space:]]*#.*$//')"
          expected_tag="v${package_version}-${package_release}"

          test -n "$package_version"
          test -n "$package_release"
          test -n "$source_version"

          if [ "$TAG" != "$expected_tag" ]; then
            echo "Release tag must be ${expected_tag}, got ${TAG}" >&2
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "package_version=$package_version"
            echo "package_release=$package_release"
            echo "source_version=$source_version"
            echo "source_ref=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Create source archive and release notes
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          PACKAGE_RELEASE: ${{ steps.version.outputs.package_release }}
          SOURCE_VERSION: ${{ steps.version.outputs.source_version }}
        run: |
          set -euo pipefail
          mkdir release
          archive="luci-app-ddns-${TAG}.tar.gz"
          git archive --format=tar.gz --prefix="luci-app-ddns-${TAG}/" --output="release/${archive}" HEAD

          printf '%s\n' \
            '## 版本信息' \
            '' \
            "- 软件包版本：\`${PACKAGE_VERSION}-${PACKAGE_RELEASE}\`" \
            "- 上游 DDNS 提交：\`${SOURCE_VERSION}\`" \
            '- 预编译 SDK：ImmortalWrt 24.10.2（IPK）、25.12.2（APK）' \
            '- 预编译目标：x86/64、armsr/armv8（ARM64）' \
            '' \
            '## ImmortalWrt 24.10.x 安装 IPK' \
            '' \
            '下载与设备目标匹配的 `ddns-web` IPK、通用的 `luci-app-ddns-web` IPK，以及系统语言对应的 `luci-i18n-ddns-web-*` IPK；请先安装主程序和 LuCI 主包，再安装翻译包：' \
            '' \
            '```sh' \
            'opkg install /tmp/ddns-web_*.ipk /tmp/luci-app-ddns-web_*.ipk' \
            'opkg install /tmp/luci-i18n-ddns-web-*.ipk' \
            '```' \
            '' \
            '## ImmortalWrt 25.12.x 安装 APK' \
            '' \
            '下载与设备目标匹配的 `ddns-web` APK、通用的 `luci-app-ddns-web` APK，以及系统语言对应的翻译 APK，然后执行：' \
            '' \
            '```sh' \
            'apk add --allow-untrusted /tmp/*ddns-web*.apk' \
            '```' \
            '' \
            '## 从源码编译' \
            '' \
            "下载 \`${archive}\`，解压后将目录放入 ImmortalWrt 源码树的 \`package/\` 下；随后在 \`make menuconfig\` 中选择 \`LuCI -> Applications -> luci-app-ddns-web\` 并编译。" \
            > release/RELEASE-NOTES.md

      - uses: actions/upload-artifact@v5
        with:
          name: release-source
          path: release/
          if-no-files-found: error

  build-packages:
    name: Build ${{ matrix.release }} ${{ matrix.label }} ${{ matrix.format }}
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: 24.10.2
            format: ipk
            label: x86-64
            target: x86/64
            common_assets: true
            sdk_url: https://downloads.immortalwrt.org/releases/24.10.2/targets/x86/64/immortalwrt-sdk-24.10.2-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          - release: 24.10.2
            format: ipk
            label: armsr-armv8
            target: armsr/armv8
            common_assets: false
            sdk_url: https://downloads.immortalwrt.org/releases/24.10.2/targets/armsr/armv8/immortalwrt-sdk-24.10.2-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          - release: 25.12.2
            format: apk
            label: x86-64
            target: x86/64
            common_assets: true
            sdk_url: https://downloads.immortalwrt.org/releases/25.12.2/targets/x86/64/immortalwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          - release: 25.12.2
            format: apk
            label: armsr-armv8
            target: armsr/armv8
            common_assets: false
            sdk_url: https://downloads.immortalwrt.org/releases/25.12.2/targets/armsr/armv8/immortalwrt-sdk-25.12.2-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Install SDK build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            coreutils \
            file \
            gawk \
            gettext \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            zlib1g-dev \
            zstd

          /usr/bin/install --version | grep -F 'GNU coreutils'
          echo '/usr/bin' >> "$GITHUB_PATH"

      - name: Download and verify ImmortalWrt SDK
        id: sdk
        shell: bash
        env:
          SDK_URL: ${{ matrix.sdk_url }}
        run: |
          set -euo pipefail
          sdk_archive="${SDK_URL##*/}"
          sdk_base_url="${SDK_URL%/*}"
          work_dir="$RUNNER_TEMP/immortalwrt-sdk"

          mkdir -p "$work_dir"
          curl --fail --location --retry 3 --output "$work_dir/$sdk_archive" "$SDK_URL"
          curl --fail --location --retry 3 --output "$work_dir/sha256sums" "$sdk_base_url/sha256sums"
          grep -F " *${sdk_archive}" "$work_dir/sha256sums" > "$work_dir/sdk.sha256"
          (cd "$work_dir" && sha256sum --check sdk.sha256)
          tar --zstd --extract --file "$work_dir/$sdk_archive" --directory "$work_dir"

          sdk_dir="$(find "$work_dir" -maxdepth 1 -type d -name 'immortalwrt-sdk-*' -print -quit)"
          test -n "$sdk_dir"
          echo "directory=$sdk_dir" >> "$GITHUB_OUTPUT"

      - name: Prepare SDK package tree
        shell: bash
        env:
          SDK_DIR: ${{ steps.sdk.outputs.directory }}
        run: |
          set -euo pipefail
          export PATH="/usr/bin:/bin:$PATH"
          test "$(command -v install)" = '/usr/bin/install'
          install --version | grep -F 'GNU coreutils'
          mkdir -p "$SDK_DIR/package/luci-app-ddns"
          rsync -a --delete --exclude='.git' "$GITHUB_WORKSPACE/" "$SDK_DIR/package/luci-app-ddns/"
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_ddns-web=m
          CONFIG_PACKAGE_luci-app-ddns-web=m
          CONFIG_PACKAGE_luci-i18n-ddns-web-zh-cn=m
          CONFIG_PACKAGE_luci-i18n-ddns-web-zh-tw=m
          EOF
          make defconfig

      - name: Build packages
        shell: bash
        env:
          SDK_DIR: ${{ steps.sdk.outputs.directory }}
        run: |
          set -euo pipefail
          export PATH="/usr/bin:/bin:$PATH"
          make -C "$SDK_DIR" package/luci-app-ddns/ddns-web/compile V=s -j"$(nproc)"
          make -C "$SDK_DIR" package/luci-app-ddns/luci-app-ddns-web/compile V=s -j"$(nproc)"

      - name: Collect release assets
        shell: bash
        env:
          SDK_DIR: ${{ steps.sdk.outputs.directory }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET_LABEL: ${{ matrix.label }}
          IMMORTALWRT_RELEASE: ${{ matrix.release }}
          PACKAGE_FORMAT: ${{ matrix.format }}
          COMMON_ASSETS: ${{ matrix.common_assets }}
        run: |
          set -euo pipefail
          mkdir release
          if [ "$PACKAGE_FORMAT" = "ipk" ]; then
            ddns_pattern='ddns-web_*.ipk'
            luci_pattern='luci-app-ddns-web_*.ipk'
            translation_pattern='luci-i18n-ddns-web-*.ipk'
          else
            ddns_pattern='ddns-web-*.apk'
            luci_pattern='luci-app-ddns-web-*.apk'
            translation_pattern='luci-i18n-ddns-web-*.apk'
          fi

          ddns_package="$(find "$SDK_DIR/bin/packages" -type f -name "$ddns_pattern" -print -quit)"
          luci_package="$(find "$SDK_DIR/bin/packages" -type f -name "$luci_pattern" -print -quit)"
          test -n "$ddns_package"
          test -n "$luci_package"

          asset_prefix="immortalwrt-${IMMORTALWRT_RELEASE}-${TARGET_LABEL}"
          cp "$ddns_package" "release/${asset_prefix}_$(basename "$ddns_package")"

          if [ "$COMMON_ASSETS" = "true" ]; then
            cp "$luci_package" "release/immortalwrt-${IMMORTALWRT_RELEASE}_$(basename "$luci_package")"
            translation_found=0
            while IFS= read -r translation_package; do
              translation_found=1
              cp "$translation_package" "release/immortalwrt-${IMMORTALWRT_RELEASE}_$(basename "$translation_package")"
            done < <(find "$SDK_DIR/bin/packages" -type f -name "$translation_pattern" -print)
            test "$translation_found" -eq 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: release-package-${{ matrix.release }}-${{ matrix.label }}
          path: release/*.${{ matrix.format }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, build-packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.ipk' -o -name '*.apk' \) -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS

      - name: Remove previous manual-release assets
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Release ${{ needs.prepare.outputs.tag }}
          body_path: release/RELEASE-NOTES.md
          generate_release_notes: true
          prerelease: false
          files: |
            release/luci-app-ddns-${{ needs.prepare.outputs.tag }}.tar.gz
            release/*.ipk
            release/*.apk
            release/SHA256SUMS
